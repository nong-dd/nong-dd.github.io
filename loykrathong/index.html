<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1224">
<meta name="description" content="ลอยกระทงออนไลน์ ไม่สร้างขยะ — เขียนคำอธิษฐานแล้วปล่อยกระทงลอยไปกับสายน้ำ">
<title>ลอยกระทงออนไลน์</title>
<script>
(function(){
  var q=location.search;
  var demo=/(?:\?|&)demo=1(?:&|$)/.test(q);
  var force=/(?:\?|&)splash=1(?:&|$)/.test(q);
  if(demo && !force) document.documentElement.classList.add("no-splash");
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230b1730'/%3E%3Ccircle cx='20' cy='11' r='7' fill='%23f3e0a8'/%3E%3Cellipse cx='16' cy='24' rx='9' ry='4' fill='%233a7a28'/%3E%3Cpath d='M16 20l1-5 1 5' stroke='%23ffd56b' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky0:#070b18;
  --sky1:#101c36;
  --sky2:#1a2d52;
  --gold:#e8c87a;
  --gold-2:#f3e0a8;
  --ink:#0b1020;
  --water0:#0a1c33;
  --water1:#102845;
  --sheet:rgba(9,14,28,.82);
  --safe-b:env(safe-area-inset-bottom,0px);
  --sheet-h:0px;
  --hz:34%;
  --font:"Sarabun","Noto Sans Thai","Tahoma","Segoe UI",sans-serif;
  --display:"Charm","Pridi","Taviraj","Sarabun",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sky0);color:#f6eede;font-family:var(--font);overflow:hidden}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
img,svg{display:block;max-width:100%}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#060a14 0%,#0c1730 28%,#16325a 48%,#1a3a5c 52%,#0c1e38 70%,#071422 100%)}

/* ---- sky ---- */
#sky{position:absolute;left:0;right:0;top:0;height:calc(var(--hz) + 2%);pointer-events:none;overflow:hidden}
#stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

#moon{position:absolute;top:36%;right:4%;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffdf2 0%,#fff0c2 38%,#f0d48a 78%,#e0b85a 100%);box-shadow:0 0 24px 8px rgba(255,236,180,.55),0 0 80px 28px rgba(255,214,120,.28),0 0 140px 50px rgba(255,190,80,.12);z-index:5}
#moon::after{content:"";position:absolute;inset:14% 22% auto auto;width:28%;height:22%;border-radius:50%;background:rgba(210,180,110,.22)}
#moon::before{content:"";position:absolute;left:22%;bottom:28%;width:18%;height:14%;border-radius:50%;background:rgba(200,170,100,.16)}

#horizon-glow{position:absolute;left:0;right:0;top:calc(var(--hz) - 6%);height:18%;background:radial-gradient(ellipse at 50% 0%,rgba(255,214,140,.18),rgba(80,120,180,.06) 42%,transparent 70%);pointer-events:none;z-index:2}

#silhouette{position:absolute;left:0;right:0;top:calc(var(--hz) - 72px);height:96px;z-index:6;pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 58%,transparent 92%);
  mask-image:linear-gradient(180deg,#000 0%,#000 58%,transparent 92%)}
#silhouette svg{width:100%;height:100%;overflow:visible;display:block}
#horizon-mist{position:absolute;left:0;right:0;top:calc(var(--hz) - 8px);height:28px;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(11,23,48,.35),rgba(14,34,60,.12) 55%,transparent)}

#lanterns{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lantern{position:absolute;bottom:-12%;will-change:transform;animation:rise var(--dur,52s) linear var(--delay,0s) infinite}
.lantern .body{filter:drop-shadow(0 0 10px rgba(255,170,60,.7))}
@keyframes rise{
  0%{transform:translate3d(0,10vh,0) rotate(-4deg);opacity:0}
  8%{opacity:.95}
  50%{transform:translate3d(var(--sway,18px),-55vh,0) rotate(5deg)}
  92%{opacity:.85}
  100%{transform:translate3d(calc(var(--sway,18px) * -1),-115vh,0) rotate(-3deg);opacity:0}
}

/* ---- water ---- */
#water{position:absolute;left:0;right:0;top:var(--hz);bottom:0;z-index:5;overflow:hidden;background:linear-gradient(180deg,#0e223c 0%,#122844 10%,#15304e 22%,#102844 45%,#0c2038 72%,#081624 100%)}
#water::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,230,170,.10),transparent 22%);pointer-events:none;z-index:1}
#moon-ref{position:absolute;right:8%;top:0;width:70px;height:62%;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(255,240,190,.42),rgba(255,220,140,.14) 40%,transparent 100%);filter:blur(3px);clip-path:polygon(30% 0,70% 0,88% 100%,12% 100%);animation:shimmer 3.8s ease-in-out infinite;transform-origin:top center}
@keyframes shimmer{0%,100%{opacity:.55;transform:scaleX(.85)}50%{opacity:.9;transform:scaleX(1.08)}}

.waves{position:absolute;left:-15%;width:130%;bottom:0;top:0;z-index:2;pointer-events:none}
.wave{position:absolute;left:0;width:200%;height:12%;opacity:.28;animation:waveX var(--spd,9s) linear infinite}
.wave.w1{top:10%;opacity:.3;--spd:11s;color:#9ec4e8}
.wave.w2{top:34%;opacity:.22;--spd:15s;animation-direction:reverse;color:#c9e2f7}
.wave.w3{top:62%;opacity:.16;--spd:19s;color:#8eb8dc}
.wave svg{width:100%;height:100%}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#sparkles{position:absolute;inset:0;z-index:3;pointer-events:none}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff8dc;box-shadow:0 0 6px #ffe9a0;animation:spark 2.8s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}40%,60%{opacity:.9;transform:scale(1)}}

#fleet{position:absolute;inset:0;z-index:6;pointer-events:none}
.kitem{position:absolute;left:0;top:0;width:67px;height:84px;transform-origin:50% 88%;pointer-events:auto;cursor:pointer;will-change:transform;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.kitem .ksvg{width:100%;height:100%;overflow:visible}
.kitem .ksvg svg{width:100%;height:100%;overflow:visible}
.kitem.kimg{width:87px;height:auto}
.kitem.kimg .ksvg{height:auto;line-height:0}
.kitem.kimg .ksvg img{width:100%;height:auto;display:block;pointer-events:none}
.kitem .kavatar{position:absolute;top:10%;right:-6px;width:21px;height:21px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);object-fit:cover;background:#2a2038;z-index:5;pointer-events:none}
.klabel{position:absolute;left:50%;bottom:100%;margin-bottom:4px;transform:translateX(-50%);transform-origin:50% 100%;width:max-content;max-width:112px;padding:3px 7px;border-radius:8px;background:rgba(8,12,24,.86);border:1px solid rgba(232,200,122,.35);color:#fff6d8;font-size:10px;line-height:1.3;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:2}
.klabel b{display:block;color:var(--gold-2);font-weight:600;font-size:10px;margin-bottom:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:98px}
.klabel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:98px;font-size:9px;opacity:.88}
.kitem.show-label .klabel{opacity:1}

/* flame flicker lives in SVG via CSS */
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flicker .32s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,.9) rotate(-6deg);opacity:.85}to{transform:scale(.88,1.15) rotate(6deg);opacity:1}}
.glow{transform-box:fill-box;transform-origin:center;animation:glowp 1.2s ease-in-out infinite alternate}
@keyframes glowp{from{opacity:.45}to{opacity:.9}}
.smoke{animation:smoke 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes smoke{0%{opacity:.5;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-16px) scale(1.4)}}

/* ---- chrome ---- */
#vignette{position:absolute;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.35) 100%)}

header{position:absolute;top:0;left:0;right:0;z-index:12;padding:calc(56px + env(safe-area-inset-top,0px)) 16px 0;text-align:center;pointer-events:none}
.ornament{width:120px;height:14px;margin:0 auto 2px;opacity:.85}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em;color:var(--gold-2);text-shadow:0 2px 12px rgba(0,0,0,.6),0 0 24px rgba(232,200,122,.35);line-height:1.15}
.sub{margin-top:4px;font-size:12px;font-weight:300;color:rgba(246,238,222,.78);text-shadow:0 1px 6px rgba(0,0,0,.7);line-height:1.5}
.eco{margin-top:3px;display:inline-block;font-size:11px;font-weight:500;letter-spacing:.02em;color:#c8f0c8;background:rgba(30,80,50,.35);border:1px solid rgba(160,220,160,.25);padding:2px 9px;border-radius:99px;text-shadow:none}

#topbar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:13;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#topbar > *{pointer-events:auto}
.iconbtns{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(8,12,24,.55);border:1px solid rgba(232,200,122,.3);display:grid;place-items:center;backdrop-filter:blur(8px);color:var(--gold-2);transition:background .2s,transform .15s}
.iconbtn:hover{background:rgba(20,28,50,.7)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{border-color:#f0d48a;box-shadow:0 0 12px rgba(232,200,122,.35)}
#counter{display:flex;flex-direction:column;align-items:flex-end;background:rgba(8,12,24,.55);border:1px solid rgba(232,200,122,.3);backdrop-filter:blur(8px);border-radius:14px;padding:6px 10px 5px;min-width:86px}
#counter .lbl{font-size:10px;color:rgba(246,238,222,.7);letter-spacing:.02em}
#counter .num{font-family:var(--display);font-size:22px;line-height:1.1;color:var(--gold-2);font-weight:700}

/* ---- designer ---- */
#designer{position:absolute;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(14,20,40,.86),rgba(8,12,24,.94));border-top:1px solid rgba(232,200,122,.38);border-radius:22px 22px 0 0;padding:6px 14px calc(10px + var(--safe-b));backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 -12px 40px rgba(0,0,0,.4);transition:padding .2s ease}
.handle{width:40px;height:4px;border-radius:4px;background:rgba(232,200,122,.35);margin:0 auto 6px}
.designer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;padding:8px 8px 8px 12px;border-radius:12px;background:linear-gradient(180deg,#e11d2e 0%,#c40e22 52%,#b3001b 100%);border:1px solid rgba(255,210,210,.3);box-shadow:0 0 18px rgba(225,29,46,.5),0 4px 14px rgba(120,0,20,.35),inset 0 1px 0 rgba(255,255,255,.28)}
#designer h2{font-size:13px;font-weight:700;color:#fff;margin:0;letter-spacing:.04em;line-height:1.3;text-shadow:0 1px 2px rgba(80,0,10,.45)}
#designer-toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(180deg,#ff4456,#9d0018);border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 12px rgba(255,70,80,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:filter .15s,transform .15s,background .15s}
#designer-toggle:hover{filter:brightness(1.08)}
#designer-toggle:active{transform:scale(.97)}
#designer-toggle .toggle-icon{font-size:11px;line-height:1}
#designer.collapsed{padding-bottom:calc(8px + var(--safe-b));background:linear-gradient(180deg,#e11d2e 0%,#c40e22 52%,#b3001b 100%);border-top-color:rgba(255,190,190,.5);box-shadow:0 -8px 28px rgba(225,29,46,.45),0 0 26px rgba(179,0,27,.35)}
#designer.collapsed .designer-bar{margin:0;padding:2px 0;background:transparent;border:0;box-shadow:none}
#designer.collapsed .handle{margin-bottom:4px;background:rgba(255,255,255,.6)}
#designer.collapsed #designer-body{display:none}
.styles{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:2px 1px 6px;scroll-snap-type:x proximity}
.styles::-webkit-scrollbar{height:4px}
.styles::-webkit-scrollbar-thumb{background:rgba(232,200,122,.35);border-radius:4px}
.style{position:relative;flex:0 0 76px;width:76px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(246,238,222,.75);font-size:10.5px;font-weight:500;transition:border .2s,background .2s,transform .15s;scroll-snap-align:start}
.style svg,.style img{width:54px;height:54px;object-fit:contain}
.style span{text-align:center;line-height:1.25;max-width:100%}
.style.sel{border-color:var(--gold);background:rgba(232,200,122,.12);color:var(--gold-2);box-shadow:0 0 0 1px rgba(232,200,122,.25)}
.style:active{transform:scale(.97)}
.colors{display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
.colors.hidden{display:none}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.swatch.sel{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold);transform:scale(1.08)}
.fields{display:grid;gap:6px;margin-bottom:8px}
.field{position:relative}
.field label{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:rgba(246,238,222,.45);pointer-events:none;transition:.15s}
.field input,.field textarea{
  width:100%;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);
  color:#fff6d8;border-radius:12px;padding:10px 12px 10px 86px;font-size:14px;outline:none;resize:none;
}
.field textarea{padding-top:10px;height:44px;line-height:1.4}
.field input:focus,.field textarea:focus{border-color:rgba(232,200,122,.55)}
.field .count{position:absolute;right:8px;bottom:6px;font-size:10px;color:rgba(246,238,222,.35)}
.photo-field{margin-top:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.photo-field .photo-lab{display:block;font-size:12px;font-weight:500;color:rgba(246,238,222,.7);margin-bottom:0}
.photo-row{display:flex;align-items:center;gap:10px;flex:1 1 auto}
#photo-pick{
  height:36px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:500;
  color:var(--gold-2);background:rgba(255,255,255,.06);border:1px solid rgba(232,200,122,.3);
}
#photo-pick:hover{background:rgba(255,255,255,.1)}
#inp-photo{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0)}
.photo-preview-wrap{position:relative;width:48px;height:48px;flex:0 0 48px;display:none}
.photo-preview-wrap.show{display:block}
.photo-preview-wrap img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px rgba(232,200,122,.35)}
#photo-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#c4473a;color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;border:1px solid rgba(255,255,255,.45)}
.photo-note{flex:1 1 100%;margin-top:0;font-size:10.5px;color:rgba(246,238,222,.45);line-height:1.4}
#float-btn{
  width:100%;height:46px;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:.06em;
  color:#2a1c06;background:linear-gradient(180deg,#f3e0a8,#d4a84b 60%,#c4963a);
  box-shadow:0 6px 18px rgba(212,168,75,.35),inset 0 1px 0 rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s,filter .15s;
}
#float-btn:hover{filter:brightness(1.06)}
#float-btn:active{transform:translateY(1px) scale(.99)}
#float-btn[disabled],#float-btn[aria-disabled="true"]{opacity:.5;filter:grayscale(.3);cursor:default}
#float-btn[disabled]:hover,#float-btn[aria-disabled="true"]:hover{filter:grayscale(.3)}
#float-btn[disabled]:active,#float-btn[aria-disabled="true"]:active{transform:none}
#float-btn svg{width:22px;height:22px}

/* popup + toast */
#popup{position:absolute;z-index:18;max-width:220px;padding:10px 12px;border-radius:14px;background:rgba(8,12,24,.88);border:1px solid rgba(232,200,122,.4);box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:translate(-50%,-110%) scale(.94);transition:opacity .25s,transform .25s;backdrop-filter:blur(10px)}
#popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-120%) scale(1)}
#popup .who{font-weight:700;color:var(--gold-2);font-size:13px;margin-bottom:3px}
#popup .wish{font-size:12.5px;line-height:1.5;color:#f6eede}
#toast{position:absolute;left:50%;bottom:calc(var(--sheet-h) + 16px);transform:translateX(-50%) translateY(8px);z-index:30;background:rgba(8,12,24,.9);border:1px solid rgba(232,200,122,.35);color:#fff6d8;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:860px){
  :root{--hz:46%}
  #moon{width:120px;height:120px;top:8%;right:16%}
  header{padding-top:22px}
  #moon-ref{right:15.2%;width:92px}
  #silhouette{top:calc(var(--hz) - 128px);height:150px}
  h1{font-size:48px}
  .sub{font-size:14px}
  #designer{
    left:auto;right:28px;bottom:28px;width:400px;border-radius:22px;
    border:1px solid rgba(232,200,122,.38);
    padding:14px 18px 16px;
  }
  #designer.collapsed{
    width:auto;min-width:240px;padding:10px 14px;
  }
  .photo-note{font-size:11px}
  .handle{display:none}
  .styles{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;padding:0 0 2px;scroll-snap-type:none}
  .style{flex:none;width:auto}
  #toast{bottom:28px;left:auto;right:28px;transform:translateY(8px);width:max-content}
  #toast.show{transform:translateY(0)}
}
/* ---- welcome splash ---- */
html.no-splash #splash{display:none!important}
#splash{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:max(24px, env(safe-area-inset-top,0px)) 22px max(24px, env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#050810 0%,#070b18 28%,#0a1428 52%,#0c1730 68%,#08101c 100%);
  color:#f6eede;
  cursor:pointer;
  opacity:1;
  transition:opacity .6s ease;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
#splash.out{opacity:0;pointer-events:none}
#splash-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#splash-stars i{
  position:absolute;border-radius:50%;background:#fff;
  box-shadow:0 0 6px rgba(255,255,255,.8);
  animation:twinkle 2.6s ease-in-out infinite;
}
#splash-moon{
  position:absolute;top:8%;right:8%;width:90px;height:90px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 35%,rgba(255,253,242,.85) 0%,rgba(255,240,194,.7) 38%,rgba(240,212,138,.55) 78%,rgba(224,184,90,.4) 100%);
  box-shadow:0 0 24px 8px rgba(255,236,180,.28),0 0 80px 28px rgba(255,214,120,.14),0 0 140px 50px rgba(255,190,80,.08);
  opacity:.7;
}
#splash-moon::after{content:"";position:absolute;inset:14% 22% auto auto;width:28%;height:22%;border-radius:50%;background:rgba(210,180,110,.22)}
#splash-river{
  position:absolute;left:0;right:0;bottom:0;height:26%;pointer-events:none;
  background:
    linear-gradient(180deg,transparent 0%,rgba(10,28,51,.28) 22%,rgba(8,20,36,.62) 68%,#060a12 100%),
    radial-gradient(ellipse at 50% 0%,rgba(255,230,170,.12),transparent 58%);

function downscalePhoto(file){
  return new Promise((resolve, reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const side=Math.min(img.naturalWidth||img.width, img.naturalHeight||img.height) || 1;
        const sx=((img.naturalWidth||img.width)-side)/2;
        const sy=((img.naturalHeight||img.height)-side)/2;
        const c=document.createElement("canvas");
        c.width=c.height=128;
        const ctx=c.getContext("2d");
        ctx.fillStyle="#1a1420";
        ctx.fillRect(0,0,128,128);
        ctx.drawImage(img,sx,sy,side,side,0,0,128,128);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      }catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src=url;
  });
}
function compressSharePhoto(src){
  return new Promise((resolve)=>{
    if(!src){ resolve(null); return; }
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.naturalWidth||img.width||1;
        const h=img.naturalHeight||img.height||1;
        const side=Math.min(w,h);
        const sx=(w-side)/2, sy=(h-side)/2;
        const c=document.createElement("canvas");
        c.width=c.height=96;
        const ctx=c.getContext("2d");
        ctx.fillStyle="#1a1420";
        ctx.fillRect(0,0,96,96);
        ctx.drawImage(img,sx,sy,side,side,0,0,96,96);
        let q=0.7, out=c.toDataURL("image/jpeg", q);
        while(out.length>FB_PHOTO_MAX && q>0.35){
          q=Math.max(0.35, q-0.1);
          out=c.toDataURL("image/jpeg", q);
        }
        resolve((out.length<=FB_PHOTO_MAX && validSharedPhoto(out)) ? out : null);
      }catch(err){ resolve(null); }
    };
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

      if(items.length>1){ items.shift(); photoFrom=0; continue; }
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
      return;

  }

function layoutItem(it, now){
  const wr=waterEl.getBoundingClientRect();
  const sheetTop = window.innerWidth>=860 ? window.innerHeight : designerEl.getBoundingClientRect().top;
  const visH = Math.max(120, Math.min(wr.height, sheetTop - wr.top));
  const itemW = it.el.offsetWidth || (isImgStyle(it.style)?87:67);
  const itemH = it.el.offsetHeight || 84;
  const farY  = isImgStyle(it.style) ? 12 : 4;
  const reserved = Math.min(itemH * 0.88, Math.max(70, visH * 0.58));
  const nearY = Math.max(farY + 24, visH - reserved);
  const t = it.depth;
  const eased = t*t*(3-2*t); // smoothstep
  const bob = Math.sin(now/480 + it.phase) * (5 + (1-t)*7);
  let drop = 0;
  if(it.launching){
    it.dropT = Math.min(1, it.dropT + 0.016/0.75);
    const d=it.dropT;
    const ease=1-Math.pow(1-d,3);
    drop = (1-ease)*(-56);
    if(it.dropT>=1) it.launching=false;
  }else{
    if(t < it.settle){
      it.depth = Math.min(it.settle, t + 0.016 * (0.018 + t*0.01));
    }
    const speed = 0.35 + (1-t)*0.65;
    it.x += it.vx * 0.016 * speed;
    if(it.x>1.16) it.x=-0.14;
    if(it.x<-0.16) it.x=1.14;
  }
  const scale = 1.08 - eased*0.86;
  const xPx = it.x * wr.width - itemW/2;
  const yPx = farY + (nearY-farY)*(1-eased) + bob + drop;
  it.el.style.transform=`translate3d(${xPx}px, ${yPx}px, 0) scale(${scale})`;
  it.el.style.zIndex=String(100+Math.round((1-t)*200));
  it.el.style.opacity = it.launching ? String(0.35+it.dropT*0.65) : (0.55+0.45*(1-eased*0.3));
  const show = it.launching || (now < it.labelUntil);
  it.el.classList.toggle("show-label", show);
  const lab=it.el.querySelector(".klabel");
  if(lab) lab.style.transform=`translateX(-50%) scale(${(1/Math.max(scale,0.28)).toFixed(3)})`;
}

let lastTs=0;
function loop(ts){
  if(!lastTs) lastTs=ts;
  // keep 0.016-ish even if tab stalls; virtual time should tick
  const now=ts;
  for(let i=0;i<fleet.length;i++) layoutItem(fleet[i], now);
  lastTs=ts;
  requestAnimationFrame(loop);
}

const GESTURE_EVTS=["pointerdown","touchstart","keydown","scroll"];
function bindFirstGesture(){
  unbindFirstGesture();
  GESTURE_EVTS.forEach(ev=>{
    document.addEventListener(ev, onFirstGesture, {capture:true, passive:true});
    window.addEventListener(ev, onFirstGesture, {capture:true, passive:true});
  });
}
function unbindFirstGesture(){
  GESTURE_EVTS.forEach(ev=>{
    document.removeEventListener(ev, onFirstGesture, true);
    window.removeEventListener(ev, onFirstGesture, true);
  });
}
function onFirstGesture(e){
  if(audio.on || audio.wanted===false){ unbindFirstGesture(); return; }
  if(e && e.target && e.target.closest && e.target.closest("#btn-sound")) return;
  if(e && e.type==="keydown" && (e.repeat || e.metaKey || e.ctrlKey || e.altKey)) return;
  unbindFirstGesture();
  startSound();
}
function stopSound(){
  const el=$("bgm");
  if(el){ try{ el.pause(); }catch(e){} }
  audio.on=false;
  audio.wanted=false;
  unbindFirstGesture();
  syncSoundUI();
}
function startSound(){
  audio.wanted=true;
  const el=$("bgm");
  if(!el || typeof el.play!=="function"){ toast("เครื่องนี้ไม่รองรับเสียง"); return; }
  el.volume=0.7;
  el.loop=true;
  const ok=()=>{ audio.on=true; unbindFirstGesture(); syncSoundUI(); };
  const fail=()=>{ audio.on=false; syncSoundUI(); bindFirstGesture(); };
  try{
    const p=el.play();
    if(p && p.then) p.then(ok).catch(fail);
    else ok();
  }catch(e){ fail(); }
}
function toggleSound(){ if(audio.on) stopSound(); else startSound(); }
function fakeAvatar(){
  const c=document.createElement("canvas");
  c.width=c.height=128;
  const g=c.getContext("2d");
  const grd=g.createLinearGradient(0,0,0,128);
  grd.addColorStop(0,"#ffd6a5");
  grd.addColorStop(1,"#f4a261");
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  g.fillStyle="#4a2c1a";
  g.beginPath(); g.ellipse(64,34,50,30,0,Math.PI,0,true); g.fill();
  g.fillRect(14,28,100,22);
  g.fillStyle="#2b1b12";
  g.beginPath(); g.arc(46,62,6,0,Math.PI*2); g.arc(82,62,6,0,Math.PI*2); g.fill();
  g.fillStyle="rgba(255,120,120,.45)";
  g.beginPath(); g.ellipse(36,76,8,5,0,0,Math.PI*2); g.ellipse(92,76,8,5,0,0,Math.PI*2); g.fill();
  g.strokeStyle="#2b1b12"; g.lineWidth=3; g.lineCap="round";
  g.beginPath(); g.arc(64,78,18,0.15*Math.PI,0.85*Math.PI); g.stroke();
  return c.toDataURL("image/jpeg",0.8);
}

/* ---- welcome splash ---- */
function buildSplashStars(){
  const box=$("splash-stars");
  if(!box) return;
  const frag=document.createDocumentFragment();
  for(let i=0;i<80;i++){
    const s=document.createElement("i");
    const size=Math.random()<0.15?2.4:(Math.random()*1.6+0.6);
    s.style.width=s.style.height=size+"px";
    s.style.left=(Math.random()*100)+"%";
    s.style.top=(Math.random()*86)+"%";
    s.style.animationDelay=(Math.random()*2.6)+"s";
    s.style.animationDuration=(2.1+Math.random()*2.2)+"s";
    s.style.opacity=String(0.35+Math.random()*0.65);
    frag.appendChild(s);
  }
  box.appendChild(frag);
}
function dismissSplash(){
  const el=$("splash");
  if(!el || el.classList.contains("out")) return;
  el.classList.add("out");
  el.setAttribute("aria-hidden","true");
  const done=()=>{
    if(!el.parentNode) return;
    el.remove();
  };
  el.addEventListener("transitionend", ev=>{
    if(ev.target===el) done();
  });
  setTimeout(done, 800);
}
function onSplashActivate(e){
  const el=$("splash");
  if(!el || el.classList.contains("out")) return;
  if(e){
    if(e.type==="keydown"){
      if(e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      if(e.key!=="Enter" && e.key!==" " && e.code!=="Space") return;
      e.preventDefault();
    }
    if(e.stopPropagation) e.stopPropagation();
  }
  // Must call play() in the same user-gesture handler
  startSound();
  dismissSplash();
}
function setupSplash(){
  const el=$("splash");
  if(!SHOW_SPLASH){
    if(el) el.remove();
    return;
  }
  if(!el) return;
  buildSplashStars();
  el.addEventListener("pointerdown", onSplashActivate);
  el.addEventListener("click", onSplashActivate);
  el.addEventListener("keydown", onSplashActivate);
  const cta=$("splash-cta");
  if(cta){
    cta.addEventListener("click", onSplashActivate);
    try{ cta.focus(); }catch(err){}
  }
}

/* ---- collapsible designer ---- */
function setDesignerCollapsed(collapsed, persistState){
  const el=designerEl;
  const btn=$("designer-toggle");
  if(!el || !btn) return;
  el.classList.toggle("collapsed", !!collapsed);
  btn.setAttribute("aria-expanded", collapsed?"false":"true");
  const icon=btn.querySelector(".toggle-icon");
  const lab=btn.querySelector(".toggle-lab");
  if(icon) icon.textContent=collapsed?"▴":"▾";
  if(lab) lab.textContent=collapsed?"ขยาย":"ย่อ";
  btn.setAttribute("aria-label", collapsed?"ขยายแถบแต่งกระทง":"ย่อแถบแต่งกระทง");
  if(persistState!==false){
    try{ localStorage.setItem(PANEL_KEY, collapsed?"collapsed":"expanded"); }catch(e){}
  }
  measureSheet();
}
function bindDesignerToggle(){
  let saved=null;
  try{ saved=localStorage.getItem(PANEL_KEY); }catch(e){}
  setDesignerCollapsed(saved==="collapsed", false);
  const btn=$("designer-toggle");
  if(!btn) return;
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    setDesignerCollapsed(!designerEl.classList.contains("collapsed"));
  });
}

/* ---- shared firebase fleet ---- */
function normalizeRemote(val){
  if(!val || typeof val!=="object") return null;
  const name=safeName(val.name, 40);
  if(!name) return null;
  const ts=Number(val.t);
  if(!Number.isFinite(ts)) return null;
  return {
    name,
    wish: safeWish(val.wish),
    style: styleById(val.style) ? val.style : "lotus",
    color: validColor(val.color),
    t: ts,
    photo: validSharedPhoto(val.photo) ? val.photo : null
  };
}
function noteKey(key){
  if(!key || seenKeys.has(key)) return false;
  seenKeys.add(key);
  updateCount();
  return true;
}
function matchPending(key, data){
  const idx=pendingLocal.findIndex(p=>p && p.name===data.name && Number(p.t)===Number(data.t));
  if(idx<0) return null;
  const it=pendingLocal[idx];
  pendingLocal.splice(idx,1);
  it.fbKey=key;
  if(it.el) it.el.dataset.fbKey=key;
  myKeys.add(key);
  noteKey(key);
  const rec=remotePool.find(p=>p.key===key);
  if(rec) rec.it=it;
  else remotePool.push({key, data, it});
  return it;
}
function addToPool(key, data, it){
  let rec=remotePool.find(p=>p.key===key);
  if(rec){
    if(it && !rec.it) rec.it=it;
    return rec;
  }
  rec={key, data, it:it||null};
  remotePool.push(rec);
  remotePool.sort((a,b)=>a.data.t-b.data.t);
  while(remotePool.length>FB_MAX_POOL){
    const old=remotePool.shift();
    if(old && old.it && !old.it.isUser && !old.it.isDemo) removeFromFleet(old.it);
  }
  return rec;
}
function evictOldestRemote(){
  const cand=remotePool.filter(p=>p.it && !p.it.isUser && !p.it.isDemo && !p.it.launching);
  if(!cand.length) return false;
  const old=cand[0];
  removeFromFleet(old.it);
  old.it=null;
  return true;
}
function showRemote(rec, live){
  if(!rec || rec.it) return rec && rec.it;
  const on=remotePool.filter(p=>p.it).length;
  if(on>=FB_MAX_SCREEN) evictOldestRemote();
  const it=makeItem({
    id: rec.key,
    fbKey: rec.key,
    fromRemote: true,
    name: rec.data.name,
    wish: rec.data.wish,
    style: rec.data.style,
    color: rec.data.color,
    photo: rec.data.photo,
    t: rec.data.t,
    isUser: false,
    launching: !!live,
    dropT: live?0:1,
    depth: 0.12+Math.random()*0.7,
    x: 0.08+Math.random()*0.84,
    settle: 0.2+Math.random()*0.55,
    vx: (Math.random()<.5?-1:1)*(0.007+Math.random()*0.012),
    labelUntil: performance.now()+(live?8000:12000)
  });
  rec.it=it||null;
  return it;
}
function onRemoteKrathong(key, val, live){
  try{
    if(!key) return;
    if(myKeys.has(key)){ noteKey(key); return; }
    const data=normalizeRemote(val);
    if(!data) return;
    if(matchPending(key, data)) return;
    if(seenKeys.has(key)) return;
    noteKey(key);
    const rec=addToPool(key, data, null);
    if(!fbSyncing) showRemote(rec, !!live);
  }catch(e){}
}
function afterInitialSync(){
  fbSyncing=false;
  fbReady=true;
  const newest=remotePool.slice(-FB_MAX_SCREEN);
  newest.forEach(r=>showRemote(r, false));
  updateCount();
  startCycle();
}
function startCycle(){
  if(fbCycleTimer) clearInterval(fbCycleTimer);
  fbCycleTimer=setInterval(cycleRemote, FB_CYCLE_MS);
}
function cycleRemote(){
  try{
    const hidden=remotePool.filter(p=>!p.it);
    const shown=remotePool.filter(p=>p.it && !p.it.isUser && !p.it.isDemo && !p.it.launching && (performance.now()-p.it.born)>8000);
    if(!hidden.length || !shown.length) return;
    if(remotePool.filter(p=>p.it).length<FB_MAX_SCREEN && hidden.length){
      showRemote(hidden[hidden.length-1], false);
      return;
    }
    const out=shown[0];
    const inn=hidden[Math.floor(Math.random()*hidden.length)];
    removeFromFleet(out.it);
    out.it=null;
    showRemote(inn, false);
  }catch(e){}
}
async function flushPublishQueue(){
  const q=publishQueue.splice(0, publishQueue.length);
  for(const it of q){
    try{ await publishKrathong(it); }catch(e){}
  }
}
async function publishKrathong(it){
  if(!it || it.isDemo || DEMO) return;
  if(!fbApi || typeof fbApi.pushFn!=="function"){
    if(!publishQueue.includes(it)) publishQueue.push(it);
    return;
  }
  try{
    const photo=await compressSharePhoto(it.photo);
    const payload={
      name: safeName(it.name, 40),
      wish: safeWish(it.wish),
      style: it.style,
      color: validColor(it.color),
      t: it.t || Date.now()
    };
    if(!payload.name) return;
    if(photo) payload.photo=photo;
    const key=await fbApi.pushFn(payload);
    if(key){
      it.fbKey=key;
      if(it.el) it.el.dataset.fbKey=key;
      myKeys.add(key);
      noteKey(key);
      pendingLocal=pendingLocal.filter(p=>p!==it);
      addToPool(key, payload, it);
      updateCount();
    }
  }catch(e){}
}

async function startFirebaseSdk(){
  const appMod=await import(FB_SDK_APP);
  const dbMod=await import(FB_SDK_DB);
  const app=appMod.initializeApp(FB_CONFIG);
  const database=dbMod.getDatabase(app);
  const krathongsRef=dbMod.ref(database, "krathongs");
  fbApi={
    pushFn: async (payload)=>{
      const r=await dbMod.push(krathongsRef, payload);
      return r && r.key;
    }
  };
  return new Promise((resolve, reject)=>{
    let settled=false;
    const done=(ok, err)=>{
      if(settled) return;
      settled=true;
      if(ok) resolve(true); else reject(err||new Error("firebase"));
    };
    try{
      dbMod.onChildAdded(krathongsRef, snap=>{
        try{ onRemoteKrathong(snap.key, snap.val(), !fbSyncing); }catch(e){}
      }, err=>done(false, err));
      dbMod.onValue(krathongsRef, ()=>{
        afterInitialSync();
        done(true);
      }, err=>done(false, err), {onlyOnce:true});
    }catch(e){ done(false, e); }
    setTimeout(()=>{ if(!settled){ afterInitialSync(); done(true); } }, 6000);
  });
}

async function startRestFallback(){
  const base=FB_CONFIG.databaseURL.replace(/\/$/,"");
  const url=base+"/krathongs.json";
  fbApi={
    pushFn: async (payload)=>{
      const res=await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
      if(!res.ok) throw new Error("rest-push");
      const j=await res.json();
      return j && j.name;
    }
  };
  const res=await fetch(url);
  if(!res.ok) throw new Error("rest-get");
  const json=await res.json();
  if(json && typeof json==="object"){
    Object.keys(json).forEach(k=>onRemoteKrathong(k, json[k], false));
  }
  afterInitialSync();
  try{
    const es=new EventSource(url);
    const handle=(raw)=>{
      try{
        const msg=JSON.parse(raw);
        if(!msg) return;
        if(msg.path==="/" && msg.data && typeof msg.data==="object"){
          Object.keys(msg.data).forEach(k=>onRemoteKrathong(k, msg.data[k], false));
          return;
        }
        if(typeof msg.path==="string" && msg.path.startsWith("/") && msg.data && typeof msg.data==="object" && msg.data.name){
          const key=msg.path.replace(/^\//,"").split("/")[0];
          onRemoteKrathong(key, msg.data, true);
        }
      }catch(e){}
    };
    es.addEventListener("put", ev=>handle(ev.data));
    es.addEventListener("patch", ev=>handle(ev.data));
    es.onerror=()=>{};
  }catch(e){}
  return true;
}

async function initShared(){
  try{
    await startFirebaseSdk();
    await flushPublishQueue();
    return true;
  }catch(e){}
  try{
    await startRestFallback();
    await flushPublishQueue();
    return true;
  }catch(e){}
  fbReady=false;
  fbSyncing=false;
  fbApi=null;
  return false;
}

  updateCount();
  measureSheet();
  window.addEventListener("resize", measureSheet);

  $("btn-sound").addEventListener("click", toggleSound);
  bindFirstGesture();
  startSound();
  setupSplash();

  if(DEMO){
    const it=makeItem({
      style:"hlongtur", color:"#ff8fab",
      photo:fakeAvatar(),
      name:"ผู้มาเยือน", wish:"ขอให้สุขใจในวันลอยกระทง",
      isDemo:true, launching:false, dropT:1,
      x:0.50, depth:0.22, settle:0.22, vx:0.01,
      labelUntil: performance.now()+20000
    });
    // not persisted, and never written to the shared database
    if(it) it.el.classList.add("show-label");
  }
  requestAnimationFrame(loop);
  void initShared().then(ok=>{
    if(!ok && !DEMO){
      loadUser();
      updateCount();
    }
  }).catch(()=>{
    if(!DEMO){ try{ loadUser(); updateCount(); }catch(e){} }
  });
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
