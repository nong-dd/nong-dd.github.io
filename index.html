const PTS={apple:1,grape:2,straw:2,gem:5,bomb:0},HIT=80,GAP=28;
const box=document.getElementById('box'),ov=document.getElementById('ov');
(function(){const fx=document.getElementById('fx');for(let i=0;i<18;i++){const p=document.createElement('div');p.className='spark';const z=4+Math.random()*8;
 p.style.cssText='left:'+(Math.random()*100)+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(7+Math.random()*8)+'s;animation-delay:'+(-Math.random()*14)+'s';fx.appendChild(p)}})();
let items=[],score,lives,time,run=false,last,spawn,best=0;
function kind(){const r=Math.random();return r<.32?'bomb':r<.7?'apple':r<.77?'grape':r<.9?'straw':'gem'}
function pickX(k){const w=box.clientWidth,max=Math.max(10,w-HIT);const near=items.filter(i=>!i.dead&&i.y<HIT*2.5);let best=Math.random()*max,bd=-1;
 for(let n=0;n<12;n++){const x=Math.random()*max;let d=Infinity;near.forEach(i=>d=Math.min(d,Math.abs(i.x-x)));if(d>=HIT+GAP)return x;if(d>bd){bd=d;best=x}}return bd>=HIT?best:null}
function hud(){s.textContent=score;t.textContent=Math.ceil(Math.max(0,time));l.textContent=Math.max(0,lives)}
function add(){const k=kind(),x=pickX(k);if(x===null)return false;const el=document.createElement('div');el.className='item';
 el.innerHTML=IMG[k]?'<img src="'+IMG[k]+'">':(k==='gem'?'💎':'💣');
 let v=230+Math.random()*170+(30-time)*11;items.forEach(i=>{if(!i.dead&&Math.abs(i.x-x)<HIT)v=Math.min(v,i.v)});
 const it={el,k,x,y:-HIT,v};el.style.left=it.x+'px';el.style.top=it.y+'px';
 el.addEventListener('pointerdown',e=>{e.preventDefault();hit(it)});box.appendChild(el);items.push(it);return true}
function pop(x,y,txt,bad){const p=document.createElement('div');p.className='pop'+(bad?' bad':'');p.textContent=txt;p.style.left=(x+16)+'px';p.style.top=y+'px';box.appendChild(p);setTimeout(()=>p.remove(),600)}
function hit(it){if(!run||it.dead)return;it.dead=true;it.el.remove();
 if(it.k==='bomb'){lives--;pop(it.x,it.y,'-1 ❤️',true);navigator.vibrate&&navigator.vibrate(150);if(lives<=0)end('bomb')}else{score+=PTS[it.k];pop(it.x,it.y,'+'+PTS[it.k])}hud()}
function loop(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;time-=dt;spawn-=dt;
 if(spawn<=0){spawn=add()===false?.05:Math.max(.3,.8-(30-time)*.015)}const h=box.clientHeight;
 items.forEach(i=>{if(i.dead)return;i.y+=i.v*dt;i.el.style.top=i.y+'px';if(i.y>h){i.dead=true;i.el.remove()}});items=items.filter(i=>!i.dead);hud();
 if(time<=0){end('time');return}requestAnimationFrame(loop)}
function clear(){box.querySelectorAll('.item,.pop').forEach(e=>e.remove());items=[]}
function start(){clear();score=0;lives=3;time=30;spawn=0;hud();ov.style.display='none';run=true;last=performance.now();requestAnimationFrame(loop)}
const MSG={high:'พลังเต็มโรงไฟฟ้า!<br>น้อง DD ภูมิใจในตัวคุณ',low:'ไฟยังไม่เต็มเลยน้า<br>ลองอีกรอบ น้อง DD รออยู่',bomb:'ตู้ม! ไฟดับซะแล้ว<br>เริ่มชาร์จใหม่กันเถอะ'};
function end(why){run=false;clear();best=Math.max(best,score);const m=why==='bomb'?'bomb':score>=30?'high':'low';
 tt.textContent='จบเกม!';tag.innerHTML=MSG[m];mascot.src=m==='high'?IMG.straw:IMG.apple;info.innerHTML='คะแนน <b style="font-size:22px">'+score+'</b><br>สถิติสูงสุด '+best;go.textContent='เล่นอีกครั้ง';ov.style.display='flex';hud()}
go.onclick=start;
if(/[?&]demo\b/.test(location.search))start();
